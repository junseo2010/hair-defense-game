<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상옥이와 예린이의 러브 스토리</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Dancing+Script:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif KR', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }

        /* 별 배경 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 메인 컨테이너 */
        .story-container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 타이틀 */
        .title-section {
            text-align: center;
            padding: 60px 20px;
            animation: fadeInDown 1.5s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title-section h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5em;
            color: #ff6b9d;
            text-shadow: 0 0 30px rgba(255, 107, 157, 0.5);
            margin-bottom: 10px;
        }

        .title-section .subtitle {
            color: #aaa;
            font-size: 1.2em;
            font-style: italic;
        }

        .heart-divider {
            font-size: 2em;
            margin: 20px 0;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* 스토리 장면 */
        .scene {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scene-number {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .scene h2 {
            color: #ff6b9d;
            font-size: 1.8em;
            margin-bottom: 20px;
        }

        .scene p {
            color: #ddd;
            line-height: 1.8;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .scene .highlight {
            color: #ffd700;
            font-weight: bold;
        }

        .scene .love-text {
            color: #ff6b9d;
            font-style: italic;
        }

        /* 캐릭터 소개 */
        .character-intro {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin: 30px 0;
        }

        .character {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            width: 200px;
            transition: transform 0.3s;
        }

        .character:hover {
            transform: translateY(-5px);
        }

        .character-emoji {
            font-size: 4em;
            margin-bottom: 10px;
        }

        .character-name {
            color: #ffd700;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .character-desc {
            color: #aaa;
            font-size: 0.9em;
        }

        /* 타이핑 효과 */
        .typing-text {
            min-height: 60px;
            color: #ff6b9d;
            font-size: 1.3em;
            font-style: italic;
            border-right: 2px solid #ff6b9d;
            padding-right: 5px;
            animation: blink 0.7s step-end infinite;
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        /* 선택지 */
        .choices {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .choice-btn {
            padding: 15px 25px;
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.2), rgba(196, 69, 105, 0.2));
            border: 2px solid #ff6b9d;
            border-radius: 10px;
            color: #fff;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }

        .choice-btn:hover {
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            transform: translateX(10px);
        }

        /* 이미지 영역 */
        .image-scene {
            text-align: center;
            padding: 30px;
        }

        .scene-image {
            font-size: 6em;
            margin: 20px 0;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 타임라인 */
        .timeline {
            position: relative;
            padding-left: 30px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, #ff6b9d, #ffd700);
        }

        .timeline-item {
            position: relative;
            padding: 15px 0;
            padding-left: 20px;
        }

        .timeline-item::before {
            content: '❤️';
            position: absolute;
            left: -25px;
            top: 15px;
            font-size: 1.2em;
        }

        .timeline-date {
            color: #ffd700;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .timeline-content {
            color: #ddd;
        }

        /* 엔딩 */
        .ending {
            text-align: center;
            padding: 60px 20px;
        }

        .ending h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 3em;
            color: #ff6b9d;
            margin-bottom: 20px;
        }

        .ending p {
            color: #ddd;
            font-size: 1.2em;
            line-height: 1.8;
        }

        .infinite-love {
            font-size: 4em;
            margin: 30px 0;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        /* 네비게이션 */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .nav-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 107, 157, 0.4);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 반응형 */
        @media (max-width: 600px) {
            .title-section h1 {
                font-size: 2.5em;
            }

            .scene {
                padding: 25px;
            }

            .character {
                width: 150px;
            }
        }

        /* 스크롤바 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #ff6b9d;
            border-radius: 4px;
        }

        /* 파티클 효과 */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* 숨김 클래스 */
        .hidden {
            display: none;
        }

        /* 페이드 인 애니메이션 */
        .fade-in {
            animation: fadeIn 1s ease forwards;
        }
    </style>
</head>
<body>
    <!-- 별 배경 -->
    <div class="stars" id="stars"></div>

    <div class="story-container">
        <!-- 타이틀 -->
        <div class="title-section" id="titleSection">
            <h1>Sangok & Yerin</h1>
            <p class="subtitle">운명적인 만남, 그리고 영원한 사랑</p>
            <div class="heart-divider">💕</div>
            <button class="nav-btn" onclick="startStory()">스토리 시작</button>
        </div>

        <!-- 스토리 컨테이너 -->
        <div id="storyContent"></div>

        <!-- 엔딩 -->
        <div class="ending hidden" id="ending">
            <h2>Happily Ever After</h2>
            <div class="infinite-love">💕</div>
            <p>상옥이와 예린이는 오래오래 행복하게 살았습니다.</p>
            <p style="margin-top: 20px; color: #ff6b9d; font-style: italic;">
                "사랑은 두 개의 영혼이 하나가 되는 것이 아니라,<br>
                두 개의 영혼이 서로를 비추며 함께 성장하는 것입니다."
            </p>
            <div style="margin-top: 40px;">
                <button class="nav-btn" onclick="restartStory()">다시 읽기</button>
            </div>
        </div>
    </div>

    <script>
        // 별 생성
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }

        // 하트 파티클 생성
        function createHeartParticles() {
            const hearts = ['❤️', '💕', '💖', '💗', '💝'];
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                particle.style.left = Math.random() * 100 + '%';
                particle.style.fontSize = Math.random() * 20 + 10 + 'px';
                particle.style.animationDuration = Math.random() * 5 + 5 + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(particle);
            }
        }

        // 스토리 데이터
        const storyScenes = [
            {
                id: 1,
                title: "첫 만남",
                content: `
                    <p>2024년 봄, 서울의 한 카페.</p>
                    <p>창가 자리에서 노트북을 열고 일에 집중하고 있던 <span class="highlight">상옥</span>.</p>
                    <p>문이 열리며 들어온 한 여성, <span class="highlight">예린</span>.</p>
                    <p>그녀의 미소에 상옥의 심장이 멈추었다.</p>
                    <p class="love-text">"그 순간, 나는 운명을 믿게 되었어요."</p>
                `,
                image: "☕"
            },
            {
                id: 2,
                title: "우연한 만남",
                content: `
                    <p>그날 이후, 상옥은 매일 같은 시간에 그 카페를 찾았다.</p>
                    <p>예린도 매일 같은 시간에 창가 자리에 앉았다.</p>
                    <p>어느 날, 예린이 먼저 말을 걸었다.</p>
                    <p class="love-text">"매일 오시는 것 같아요. 혹시 저를 기다리시나요?"</p>
                    <p>상옥은 얼굴이 빨개졌지만, 솔직하게 대답했다.</p>
                    <p class="love-text">"네, 사실... 당신을 기다리고 있었어요."</p>
                `,
                image: "😊"
            },
            {
                id: 3,
                title: "첫 데이트",
                content: `
                    <p>예린의 첫 데이트 제안, 상옥은 심장이 터질 것 같았다.</p>
                    <p>남산타워에서 만나기로 했다.</p>
                    <p>예린이 빨간 원피스를 입고 나타났을 때, 상옥은 숨이 멎는 줄 알았다.</p>
                    <p class="love-text">"오늘 정말 예뻐요."</p>
                    <p>예린이 수줍게 웃으며 말했다.</p>
                    <p class="love-text">"상옥 씨도 오늘 멋져요."</p>
                    <p>두 사람의 손이 자연스럽게 맞닿았다.</p>
                `,
                image: "🗼"
            },
            {
                id: 4,
                title: "고백",
                content: `
                    <p>첫 데이트 후 3개월이 지났다.</p>
                    <p>상옥은 예린의 마음을 확신하고 있었다.</p>
                    <p>가을 공원, 단풍잎이 떨어지는 길을 걷다가 멈춰 섰다.</p>
                    <p class="love-text">"예린아, 나 너를 좋아해. 정말 많이 좋아해."</p>
                    <p>예린의 눈에 눈물이 맺혔다.</p>
                    <p class="love-text">"나도 좋아해, 상옥아. 정말 많이."</p>
                    <p>두 사람은 그렇게 첫 키스를 나누었다.</p>
                `,
                image: "🍂"
            },
            {
                id: 5,
                title: "사랑의 계절",
                content: `
                    <p>겨울이 오고, 봄이 오고, 여름이 오고, 가을이 또 왔다.</p>
                    <p>상옥과 예린의 사랑은 계절처럼 변했지만, 변하지 않는 것이 있었다.</p>
                    <p>서로를 향한 마음이었다.</p>
                    <p>함께 보낸 시간들이 추억이 되고, 추억들이 추억이 되었다.</p>
                    <p class="love-text">"매일매일이 너와 함께라면 행복해."</p>
                `,
                image: "🌸"
            },
            {
                id: 6,
                title: "프로포즈",
                content: `
                    <p>2025년 크리스마스 이브.</p>
                    <p>상옥은 예린을 처음 만난 카페로 데려갔다.</p>
                    <p>카페는 예쁘게 꾸며져 있었고, 창가 자리에는 빨간 장미가 놓여 있었다.</p>
                    <p>상옥이 무릎을 꿇고 반지를 꺼냈다.</p>
                    <p class="love-text">"예린아, 나와 평생 함께해줄래? 네 곁에서 영원히 너를 사랑할게."</p>
                    <p>예린이 눈물을 흘리며 고개를 끄덕였다.</p>
                    <p class="love-text">"네, 네, 네! 평생 함께해요!"</p>
                `,
                image: "💍"
            },
            {
                id: 7,
                title: "결혼식",
                content: `
                    <p>2026년 봄, 두 사람의 결혼식이 열렸다.</p>
                    <p>예린이 웨딩드레스를 입고 나타났을 때, 상옥은 숨이 멎었다.</p>
                    <p>예린은 세상에서 가장 아름다운 신부였다.</p>
                    <p>상옥은 예린의 손을 잡고 약속했다.</p>
                    <p class="love-text">"평생 너를 사랑하고, 너를 지키겠습니다."</p>
                    <p>예린도 속삭였다.</p>
                    <p class="love-text">"나도 평생 당신을 사랑합니다."</p>
                `,
                image: "👰"
            }
        ];

        let currentScene = 0;

        function startStory() {
            document.getElementById('titleSection').classList.add('hidden');
            document.getElementById('storyContent').classList.remove('hidden');
            showScene(0);
        }

        function showScene(index) {
            currentScene = index;
            const scene = storyScenes[index];
            const container = document.getElementById('storyContent');

            let html = `
                <div class="scene fade-in">
                    <span class="scene-number">Chapter ${scene.id}</span>
                    <h2>${scene.title}</h2>
                    <div class="image-scene">
                        <div class="scene-image">${scene.image}</div>
                    </div>
                    ${scene.content}
            `;

            // 선택지 추가 (특정 장면에서)
            if (index === 1) {
                html += `
                    <div class="choices">
                        <button class="choice-btn" onclick="showChoiceResponse(0)">
                            "저도 매일 오는 이유가 있어요..."
                        </button>
                        <button class="choice-btn" onclick="showChoiceResponse(1)">
                            "그냥... 이 카페가 좋아서요."
                        </button>
                    </div>
                    <div id="choiceResponse"></div>
                `;
            }

            html += `</div>`;

            // 네비게이션 버튼
            html += `
                <div class="nav-buttons">
                    ${index > 0 ? '<button class="nav-btn" onclick="showScene(' + (index - 1) + ')">이전으로</button>' : ''}
                    ${index < storyScenes.length - 1 ? '<button class="nav-btn" onclick="showScene(' + (index + 1) + ')">다음으로</button>' : '<button class="nav-btn" onclick="showEnding()">엔딩 보기</button>'}
                </div>
            `;

            container.innerHTML = html;
        }

        function showChoiceResponse(choice) {
            const responseDiv = document.getElementById('choiceResponse');
            if (choice === 0) {
                responseDiv.innerHTML = `
                    <div class="scene" style="margin-top: 20px;">
                        <p class="love-text">"그 이유가... 당신이에요."</p>
                        <p>예린이 얼굴을 붉히며 웃었다.</p>
                        <p class="love-text">"저도... 같은 이유예요."</p>
                    </div>
                `;
            } else {
                responseDiv.innerHTML = `
                    <div class="scene" style="margin-top: 20px;">
                        <p>예린이 아쉬운 표정을 지었다.</p>
                        <p class="love-text">"그런가요... 저는 상옥 씨를 보러 오는데..."</p>
                        <p>상옥이 당황하며 말을 이었다.</p>
                        <p class="love-text">"아, 아니... 그것도 있지만... 사실 예린 씨가 좋아서요."</p>
                    </div>
                `;
            }
        }

        function showEnding() {
            document.getElementById('storyContent').classList.add('hidden');
            document.getElementById('ending').classList.remove('hidden');
        }

        function restartStory() {
            document.getElementById('ending').classList.add('hidden');
            document.getElementById('titleSection').classList.remove('hidden');
            document.getElementById('storyContent').classList.add('hidden');
            currentScene = 0;
        }

        // 초기화
        createStars();
        createHeartParticles();
    </script>
</body>
</html>
